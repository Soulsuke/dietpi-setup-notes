# Reject all 444 default:
server
{
  server_name _;
  listen 443 ssl default_server;
  include snippets/ssl.conf;
  ssl_certificate /etc/nginx/certs/dietpi/dietpi.crt;
  ssl_certificate_key /etc/nginx/certs/dietpi/dietpi.key;

  # Set specific logs:
  access_log /var/log/nginx/default-444_access.log;
  error_log /var/log/nginx/default-444_error.log;

  # Make 444 the default error code for odd requests:
  error_page 400 405 408 411 413 414 416 494 495 496 497 =444 /dev/null;

  # Everything that gets here is a 444:
  return 444;
}

