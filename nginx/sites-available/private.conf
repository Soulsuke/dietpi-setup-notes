# Needed to support websocket connections.
# See: https://nginx.org/en/docs/http/websocket.html .
# Instead of "close" as stated in the above link we send an empty value.
# Else all keepalive connections will not work.
map $http_upgrade $connection_upgrade
{
  default upgrade;
  ''      "";
}



# Allowed ips:
geo $allowed_private
{
  default         0;
  192.168.1.0/24  1;
  127.0.0.1       1;
}



# Private server:
server
{
  server_name 192.168.XXX.XXX;
  listen 443 ssl;
  include snippets/ssl.conf;
  ssl_certificate /etc/nginx/certs/dietpi/dietpi.crt;
  ssl_certificate_key /etc/nginx/certs/dietpi/dietpi.key;

  # Generic proxy config:
  proxy_cache_bypass $http_upgrade;
  proxy_http_version 1.1;
  proxy_read_timeout 86400;
  proxy_set_header Accept-Encoding "";
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host $server_name;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Real-IP $remote_addr;

  # Set specific logs:
  access_log /var/log/nginx/private_access.log;
  error_log /var/log/nginx/private_error.log;



  ### Default server hardening
  #############################################################################

  # Make 444 the default error code for odd requests:
  error_page 400 405 408 411 413 414 416 494 495 496 497 =444 /dev/null;



  # Prevent all non-restful request methods:
  if ( $request_method !~* ^(GET|HEAD|POST|PUT|DELETE|OPTIONS|PATCH) )
  {
    return 444;
  }



  # 444 on all non-allowed:
  if ( $allowed_private = 0 )
  {
    return 444;
  }



  # Let's also make sure to throw a 444 unless we got here with the right
  # server name:
  if ( $host != "192.168.XXX.XXX" )
  {
    return 444;
  }



  ### Main route - 444
  #############################################################################
  location /
  {
    return 444;
  }



  ### PiHole
  #############################################################################

  # Make only the plain main route redirect to the admin interface:
  location ~ ^/pihole/?$
  {
    return 301 $scheme://$host/pihole/admin/;
  }



  # Everything that gets here goes to pihole:
  location /pihole/
  {
    rewrite ^/pihole/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:9017/;
  }



  ### Vaultwarden
  #############################################################################

  # Needed here too.
  location /images/
  {
    root /mnt/dietpi_userdata/vaultwarden/web-vault/;
  }



  # This is to stop those pesky billing apis that end up in 404s.
  location ~ ^/vaultwarden/.*billing
  {
    default_type application/json;
    return 200 "{}";
  }



  # Also available from here.
  location /vaultwarden/
  {
    proxy_pass http://127.0.0.1:9007;
  }



  # NOTE: this must be present in vaultwarden's domain!
  #       Eg: DOMAIN='https://localhost/vaultwarden'
  # NOTE: to enable set `WEB_VAULT_ENABLED=true` and set an ADMIN_TOKEN.
  location /vaultwarden/admin
  {
    proxy_pass http://127.0.0.1:9007;
  }

}

