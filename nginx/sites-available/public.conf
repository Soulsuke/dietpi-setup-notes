# Needed to support websocket connections.
# See: https://nginx.org/en/docs/http/websocket.html .
# Instead of "close" as stated in the above link we send an empty value.
# Else all keepalive connections will not work.
map $http_upgrade $connection_upgrade
{
  default upgrade;
  ''      "";
}



# Public server:
server
{
  server_name PUBLIC_HOSTNAME;
  listen 443 ssl;
  include snippets/ssl.conf;
  ssl_certificate /etc/letsencrypt/live/PUBLIC_HOSTNAME/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/PUBLIC_HOSTNAME/privkey.pem;

  # Generic proxy config:
  proxy_cache_bypass $http_upgrade;
  proxy_http_version 1.1;
  proxy_read_timeout 86400;
  proxy_set_header Accept-Encoding "";
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host $server_name;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Real-IP $remote_addr;

  # Set specific logs:
  access_log /var/log/nginx/public_access.log;
  error_log /var/log/nginx/public_error.log;



  ### Rails server
  #############################################################################
  location /
  {
    # Enable passenger:
    passenger_enabled on;

    # Environment:
    rails_env production;

    # Set the right ruby version to use:
    passenger_ruby /home/RAILS_USER/.rbenv/versions/4.0.2/bin/ruby;

    # Redirect server error pages to the static page /50x.html
    error_page 500 502 503 504 /50x.html;

    # Site root:
    alias /mnt/dietpi_userdata/RAILS_WEBSITE/public/;
  }



  ### Static pages
  #############################################################################

  location /foobar
  {
    alias /mnt/dietpi_userdata/foobar;
    index index.html;
  }



  ### Vaultwarden
  #############################################################################

  # Apparently vaultwarden's web client has some hardcoded paths to imagess, so
  # let's redirect them.
  location /images/
  {
    root /mnt/dietpi_userdata/vaultwarden/web-vault/;
  }



  # This is to stop those pesky billing apis that end up in 404s.
  location ~ ^/vaultwarden/.*billing
  {
    default_type application/json;
    return 200 "{}";
  }



  # NOTE: this must be present in vaultwarden's domain!
  #       Eg: DOMAIN='https://localhost/vaultwarden'
  # NOTE: to enable set `WEB_VAULT_ENABLED=true`.
  location /vaultwarden/
  {
    proxy_pass http://127.0.0.1:9007;
  }



  # The admin interface should always return a 403:
  location /vaultwarden/admin
  {
    return 403;
  }

}

