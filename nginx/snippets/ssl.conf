###############################################################################
### SSL settings                                                            ###
###############################################################################

# Enable the HTTP/2 protocol:
http2 on;

# Supported protocols:
ssl_protocols TLSv1.2 TLSv1.3;

# Config suggested by mozilla (intermediate):
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;

# minimize handshake by increasing keepalive (60->75):
keepalive_timeout 75;

# 10 minutes session:
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP Stapling:
# NOTE: this is off as it's a self-signed certificate.
ssl_stapling off;
ssl_stapling_verify off;

# Diffie-Hellman Param:
# NOTE: generate with `openssl dhparam -out /etc/ssl/certs/dhparam.pem 2048`
ssl_dhparam /etc/ssl/certs/dhparam.pem;

# Default resolver is google:
resolver 8.8.8.8 8.8.4.4 valid=300s;
resolver_timeout 5s;

